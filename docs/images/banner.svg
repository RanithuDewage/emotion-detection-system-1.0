<svg fill="none" viewBox="0 0 900 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .banner-container {
          background: linear-gradient(135deg, #090d16 0%, #111827 50%, #1e1b4b 100%);
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 18px;
          height: 238px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .glow-circle {
          position: absolute;
          border-radius: 50%;
          filter: blur(50px);
          opacity: 0.45;
          animation: pulse 6s infinite alternate ease-in-out;
        }

        .glow-1 {
          width: 180px;
          height: 180px;
          background: #6366f1;
          top: -40px;
          left: -40px;
        }

        .glow-2 {
          width: 200px;
          height: 200px;
          background: #ec4899;
          bottom: -50px;
          right: -50px;
          animation-delay: -3s;
        }

        @keyframes pulse {
          0% { transform: scale(0.9); opacity: 0.3; }
          100% { transform: scale(1.2); opacity: 0.6; }
        }

        .badge {
          background: rgba(99, 102, 241, 0.2);
          border: 1px solid rgba(129, 140, 248, 0.4);
          color: #a5b4fc;
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          padding: 4px 14px;
          border-radius: 999px;
          margin-bottom: 12px;
          display: flex;
          align-items: center;
          gap: 6px;
          z-index: 2;
        }

        .title {
          font-size: 32px;
          font-weight: 800;
          background: linear-gradient(90deg, #ffffff, #c7d2fe, #a855f7, #60a5fa, #ffffff);
          background-size: 200% auto;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: shine 4s linear infinite;
          margin: 0;
          z-index: 2;
          letter-spacing: -0.02em;
        }

        @keyframes shine {
          to { background-position: 200% center; }
        }

        .subtitle {
          color: #94a3b8;
          font-size: 14px;
          margin-top: 8px;
          z-index: 2;
          font-weight: 400;
        }

        .emojis {
          margin-top: 14px;
          display: flex;
          gap: 16px;
          font-size: 24px;
          z-index: 2;
        }

        .emoji-item {
          display: inline-block;
          animation: float 2.5s infinite ease-in-out alternate;
        }

        .e1 { animation-delay: 0s; }
        .e2 { animation-delay: 0.3s; }
        .e3 { animation-delay: 0.6s; }
        .e4 { animation-delay: 0.9s; }
        .e5 { animation-delay: 1.2s; }

        @keyframes float {
          0% { transform: translateY(0px) scale(1); }
          100% { transform: translateY(-7px) scale(1.15); }
        }
      </style>
      <div class="banner-container">
        <div class="glow-circle glow-1"></div>
        <div class="glow-circle glow-2"></div>
        <div class="badge">IBM AI Developer Professional Project</div>
        <h1 class="title">AI Emotion Detection System</h1>
        <p class="subtitle">Fine-Grained Emotion Recognition &amp; Sentiment Intelligence via Watson NLP &amp; Flask</p>
        <div class="emojis">
          <span class="emoji-item e1" title="Joy">😄</span>
          <span class="emoji-item e2" title="Anger">😠</span>
          <span class="emoji-item e3" title="Disgust">🤢</span>
          <span class="emoji-item e4" title="Fear">😨</span>
          <span class="emoji-item e5" title="Sadness">😢</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
